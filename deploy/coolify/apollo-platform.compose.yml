name: apollo-platform

x-runtime: &runtime
  init: true
  restart: unless-stopped
  stop_grace_period: 20s
  pids_limit: 128
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
        pids: 128
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-job: &job
  init: true
  restart: "no"
  stop_grace_period: 20s
  pids_limit: 64
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 256M
        pids: 64
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  platform-postgres:
    <<: *runtime
    image: ${PLATFORM_POSTGRES_IMAGE:?}
    environment:
      POSTGRES_DB: apollo_platform
      POSTGRES_PASSWORD_FILE: /run/secrets/platform_postgres_admin_password
      POSTGRES_USER: postgres
    secrets:
      - source: platform_postgres_admin_password
        target: platform_postgres_admin_password
        uid: "999"
        gid: "999"
        mode: "0400"
      - source: platform_migrator_password
        target: platform_migrator_password
        uid: "999"
        gid: "999"
        mode: "0400"
      - source: platform_runtime_password
        target: platform_runtime_password
        uid: "999"
        gid: "999"
        mode: "0400"
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
    networks:
      - platform-data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d apollo_platform
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  platform-redis:
    <<: *runtime
    image: ${PLATFORM_REDIS_IMAGE:?}
    user: "999:999"
    read_only: true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - platform-redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - platform-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

  platform-migrate:
    <<: *job
    image: ${PLATFORM_API_IMAGE:?}
    user: "10001:10001"
    read_only: true
    command: ["node", "/app/dist/migrate.mjs"]
    environment:
      MIGRATOR_DATABASE_URL_FILE: /run/secrets/platform_migrator_database_url
    secrets:
      - source: platform_migrator_database_url
        target: platform_migrator_database_url
        uid: "10001"
        gid: "10001"
        mode: "0400"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - platform-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      platform-postgres:
        condition: service_healthy

  platform-api:
    <<: *runtime
    image: ${PLATFORM_API_IMAGE:?}
    user: "10001:10001"
    read_only: true
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT:?}:8080"
    environment:
      APOLLO_ALLOWED_ORIGINS: ${PLATFORM_ALLOWED_ORIGINS:?}
      APOLLO_API_VERSION: ${PLATFORM_API_VERSION:?}
      APOLLO_ASSERTION_PRIVATE_JWK_FILE: /run/secrets/platform_assertion_private_jwk
      APOLLO_ASSERTION_PUBLIC_JWKS_FILE: /run/secrets/platform_assertion_public_jwks
      APOLLO_DEPLOYED_AT: ${PLATFORM_DEPLOYED_AT:?}
      APOLLO_DEVELOPMENT_TOKEN_ECHO: "false"
      APOLLO_INTROSPECTION_CLIENT_ID: apollo-tf-api
      APOLLO_ISSUER: ${PLATFORM_PUBLIC_ORIGIN:?}
      APOLLO_OAUTH_CLIENTS_FILE: /run/secrets/platform_oauth_clients
      APOLLO_OPERATOR_BOOTSTRAP_TOKEN_FILE: /run/secrets/platform_operator_bootstrap_token
      APOLLO_REDIS_URL: redis://platform-redis:6379
      APOLLO_TRUST_PROXY_HOPS: "1"
      DATABASE_URL_FILE: /run/secrets/platform_runtime_database_url
      NODE_ENV: production
      PORT: "8080"
    secrets:
      - source: platform_assertion_private_jwk
        target: platform_assertion_private_jwk
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: platform_assertion_public_jwks
        target: platform_assertion_public_jwks
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: platform_oauth_clients
        target: platform_oauth_clients
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: platform_operator_bootstrap_token
        target: platform_operator_bootstrap_token
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: platform_runtime_database_url
        target: platform_runtime_database_url
        uid: "10001"
        gid: "10001"
        mode: "0400"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - platform-edge
      - platform-data
      - platform-bridge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
      platform-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all(['/healthz','/readyz'].map(async p=>{const r=await fetch('http://127.0.0.1:8080'+p);if(!r.ok)throw new Error('not ready')}))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

secrets:
  platform_assertion_private_jwk:
    file: ${PLATFORM_SECRET_DIRECTORY:?}/platform_assertion_private_jwk
  platform_assertion_public_jwks:
    file: ${PLATFORM_SECRET_DIRECTORY:?}/platform_assertion_public_jwks
  platform_migrator_database_url:
    file: ${PLATFORM_SECRET_DIRECTORY:?}/platform_migrator_database_url
  platform_migrator_password:
    file: ${PLATFORM_SECRET_DIRECTORY:?}/platform_migrator_password
  platform_oauth_clients:
    file: ${PLATFORM_SECRET_DIRECTORY:?}/platform_oauth_clients
  platform_operator_bootstrap_token:
    file: ${PLATFORM_SECRET_DIRECTORY:?}/platform_operator_bootstrap_token
  platform_postgres_admin_password:
    file: ${PLATFORM_SECRET_DIRECTORY:?}/platform_postgres_admin_password
  platform_runtime_database_url:
    file: ${PLATFORM_SECRET_DIRECTORY:?}/platform_runtime_database_url
  platform_runtime_password:
    file: ${PLATFORM_SECRET_DIRECTORY:?}/platform_runtime_password

volumes:
  platform-postgres-data:
    name: apollo-platform-postgres-v1
  platform-redis-data:
    name: apollo-platform-redis-v1

networks:
  platform-bridge:
    name: apollo-platform-bridge-v1
    internal: true
  platform-edge:
    name: apollo-platform-edge-v1
  platform-data:
    name: apollo-platform-data-v1
    internal: true
