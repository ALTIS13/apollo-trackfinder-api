version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trackfinder
      POSTGRES_PASSWORD: trackfinder
      POSTGRES_DB: trackfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: postgres://trackfinder:trackfinder@db:5432/trackfinder
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET}"
      SERVER_URL: "${SERVER_URL:-https://api.apollot.ru}"
      WEB_URL: "${WEB_URL:-https://web.apollot.ru}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: artifacts/music-player/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: "${VITE_API_URL:-https://api.apollot.ru}"

  admin:
    build:
      context: .
      dockerfile: artifacts/admin-dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      APOLLO_API_UPSTREAM: "http://api:8080"
      ADMIN_DASHBOARD_TOKEN: "${ADMIN_DASHBOARD_TOKEN:-}"

volumes:
  pgdata:
