services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackfinder
      POSTGRES_PASSWORD_FILE: /run/secrets/tf_postgres_password
      POSTGRES_USER: trackfinder
    secrets:
      - tf_postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tf-data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U trackfinder -d trackfinder"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-bookworm
    user: "999:999"
    restart: unless-stopped
    read_only: true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - tf-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    ports:
      - "127.0.0.1:${TF_API_PORT:-8080}:8080"
    environment:
      ADMIN_DASHBOARD_TOKEN: "${ADMIN_DASHBOARD_TOKEN:-}"
      APOLLO_API_VERSION: "${APOLLO_API_VERSION:-unknown}"
      APOLLO_DEPLOYED_AT: "${APOLLO_DEPLOYED_AT:-}"
      APOLLO_MODULE_HEARTBEAT_KEYS_FILE: /run/secrets/tf_module_heartbeat_keys
      APOLLO_PLATFORM_API_ORIGIN: "${APOLLO_PLATFORM_API_ORIGIN:-https://api.apollot.ru}"
      APOLLO_PLATFORM_ISSUER: "${APOLLO_PLATFORM_ISSUER:-https://api.apollot.ru}"
      APOLLO_TF_AUTH_REDIS_URL: redis://redis:6379/1
      APOLLO_TF_CALLBACK_URL: "${APOLLO_TF_CALLBACK_URL:-https://api.tf.apollot.ru/api/auth/callback}"
      APOLLO_TF_CLIENT_ID: "${APOLLO_TF_CLIENT_ID:-apollo-tf-api}"
      APOLLO_TF_CLIENT_SECRET_FILE: /run/secrets/tf_client_secret
      APOLLO_TF_WEB_ORIGIN: "${APOLLO_TF_WEB_ORIGIN:-https://tf.apollot.ru}"
      DATABASE_URL_FILE: /run/secrets/tf_database_url
      NODE_ENV: production
      PORT: "8080"
      REDIS_URL: redis://redis:6379/0
      SERVER_URL: "${SERVER_URL:-https://api.tf.apollot.ru}"
      TF_INTEGRATIONS_ALLOW_INSECURE_HTTP: "true"
      TF_INTEGRATIONS_INTERNAL_AUTH_SECRET_FILE: /run/secrets/tf_integrations_internal_auth_secret
      TF_INTEGRATIONS_ORIGIN: http://tf-integrations:8080
      TF_DOWNLOAD_QUEUE_ALLOW_INSECURE_REDIS: "true"
      TF_DOWNLOAD_QUEUE_REDIS_URL_FILE: /run/secrets/tf_download_queue_redis_url
      TF_DOWNLOAD_WORKER_ALLOW_INSECURE_HTTP: "true"
      TF_DOWNLOAD_WORKER_INTERNAL_AUTH_SECRET_FILE: /run/secrets/tf_download_internal_auth_secret
      TF_DOWNLOAD_WORKER_ORIGIN: http://tf-download-worker:8080
      TF_SEARCH_ALLOW_INSECURE_HTTP: "true"
      TF_SEARCH_INTERNAL_AUTH_SECRET_FILE: /run/secrets/tf_search_internal_auth_secret
      TF_SEARCH_ORIGIN: http://tf-search:8080
      WEB_URL: "${WEB_URL:-https://tf.apollot.ru}"
    secrets:
      - tf_client_secret
      - tf_database_url
      - source: tf_integrations_internal_auth_secret
        target: tf_integrations_internal_auth_secret
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: tf_download_queue_redis_url
        target: tf_download_queue_redis_url
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: tf_download_internal_auth_secret
        target: tf_download_internal_auth_secret
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - tf_module_heartbeat_keys
      - tf_search_internal_auth_secret
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks:
      - tf-data
      - tf-edge
      - tf-integrations-control
      - tf-search-control
      - tf-download-queue
      - tf-download-control
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      tf-integrations:
        condition: service_healthy
      tf-search:
        condition: service_healthy
      tf-download-redis:
        condition: service_healthy
      tf-download-worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/api/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 3s
      retries: 20

  tf-download-redis:
    build:
      context: .
      dockerfile: artifacts/tf-download-worker/Dockerfile
      target: queue-redis
    image: ${TF_DOWNLOAD_REDIS_IMAGE:-apollo-tf-download-redis:local}
    restart: unless-stopped
    user: "999:999"
    read_only: true
    init: true
    environment:
      TF_DOWNLOAD_QUEUE_PASSWORD_FILE: /run/secrets/tf_download_queue_password
    secrets:
      - source: tf_download_queue_password
        target: tf_download_queue_password
        uid: "999"
        gid: "999"
        mode: "0400"
    volumes:
      - tf-download-redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - tf-download-queue
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "/usr/local/bin/queue-redis-health.sh"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  tf-download-worker:
    build:
      context: .
      dockerfile: artifacts/tf-download-worker/Dockerfile
      target: runtime
    image: ${TF_DOWNLOAD_WORKER_IMAGE:-apollo-tf-download-worker:local}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    init: true
    environment:
      APOLLO_API_VERSION: "${APOLLO_API_VERSION:-unknown}"
      APOLLO_DEPLOYED_AT: "${APOLLO_DEPLOYED_AT:-}"
      NODE_ENV: production
      PORT: "8080"
      TF_DOWNLOAD_QUEUE_REDIS_URL_FILE: /run/secrets/tf_download_queue_redis_url
      TF_DOWNLOAD_QUEUE_ALLOW_INSECURE_REDIS: "true"
      TF_DOWNLOAD_INTERNAL_AUTH_SECRET_FILE: /run/secrets/tf_download_internal_auth_secret
      TF_DOWNLOAD_HEARTBEAT_SECRET_FILE: /run/secrets/tf_download_heartbeat_secret
      TF_DOWNLOAD_HEARTBEAT_API_ORIGIN: http://api:8080
      TF_DOWNLOAD_HEARTBEAT_ALLOW_INSECURE_HTTP: "true"
      TF_DOWNLOAD_STORAGE_ROOT: /var/lib/apollo-tf/downloads
    secrets:
      - source: tf_download_queue_redis_url
        target: tf_download_queue_redis_url
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: tf_download_internal_auth_secret
        target: tf_download_internal_auth_secret
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: tf_download_heartbeat_secret
        target: tf_download_heartbeat_secret
        uid: "10001"
        gid: "10001"
        mode: "0400"
    volumes:
      - tf-download-worker-data:/var/lib/apollo-tf/downloads
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      tf-download-queue:
        gw_priority: 0
      tf-download-control:
        gw_priority: 0
      tf-download-egress:
        gw_priority: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 45s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 256
        reservations:
          cpus: "0.5"
          memory: 256M
    depends_on:
      tf-download-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 3s
      retries: 20

  tf-integrations-postgres:
    build:
      context: .
      dockerfile: artifacts/tf-integrations/Dockerfile
      target: postgres-role-init
    image: ${TF_INTEGRATIONS_POSTGRES_IMAGE:-apollo-tf-integrations-postgres:local}
    restart: unless-stopped
    environment:
      POSTGRES_DB: apollo_tf_integrations
      POSTGRES_PASSWORD_FILE: /run/secrets/tf_integrations_postgres_admin_password
      POSTGRES_USER: postgres
    secrets:
      - source: tf_integrations_postgres_admin_password
        target: tf_integrations_postgres_admin_password
        uid: "999"
        gid: "999"
        mode: "0400"
      - source: tf_integrations_migrator_password
        target: tf_integrations_migrator_password
        uid: "999"
        gid: "999"
        mode: "0400"
      - source: tf_integrations_runtime_password
        target: tf_integrations_runtime_password
        uid: "999"
        gid: "999"
        mode: "0400"
    volumes:
      - tf-integrations-postgres-data:/var/lib/postgresql/data
    networks:
      - tf-integrations-data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U postgres -d apollo_tf_integrations
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  tf-integrations-migrate:
    build:
      context: .
      dockerfile: artifacts/tf-integrations/Dockerfile
      target: runtime
    image: ${TF_INTEGRATIONS_IMAGE:-apollo-tf-integrations:local}
    user: "10001:10001"
    read_only: true
    init: true
    command: ["node", "/app/dist/migrate.mjs"]
    environment:
      TF_INTEGRATIONS_DATABASE_URL_FILE: /run/secrets/tf_integrations_migrator_database_url
    secrets:
      - source: tf_integrations_migrator_database_url
        target: tf_integrations_migrator_database_url
        uid: "10001"
        gid: "10001"
        mode: "0400"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - tf-integrations-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 64
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      tf-integrations-postgres:
        condition: service_healthy
    restart: "no"

  tf-integrations:
    build:
      context: .
      dockerfile: artifacts/tf-integrations/Dockerfile
      target: runtime
    image: ${TF_INTEGRATIONS_IMAGE:-apollo-tf-integrations:local}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    init: true
    environment:
      APOLLO_API_VERSION: "${TF_INTEGRATIONS_VERSION:-unknown}"
      APOLLO_DEPLOYED_AT: "${TF_INTEGRATIONS_DEPLOYED_AT:-}"
      NODE_ENV: production
      PORT: "8080"
      TF_INTEGRATIONS_DATABASE_URL_FILE: /run/secrets/tf_integrations_runtime_database_url
      TF_INTEGRATIONS_HEARTBEAT_ALLOW_INSECURE_HTTP: "true"
      TF_INTEGRATIONS_HEARTBEAT_API_ORIGIN: http://api:8080
      TF_INTEGRATIONS_HEARTBEAT_SECRET_FILE: /run/secrets/tf_integrations_heartbeat_secret
      TF_INTEGRATIONS_INTERNAL_AUTH_SECRET_FILE: /run/secrets/tf_integrations_internal_auth_secret
      TF_INTEGRATIONS_SPOTIFY_CALLBACK_URI: "${TF_INTEGRATIONS_SPOTIFY_CALLBACK_URI:-https://api.tf.apollot.ru/api/spotify/callback}"
      TF_INTEGRATIONS_SPOTIFY_CLIENT_ID_FILE: /run/secrets/tf_integrations_spotify_client_id
      TF_INTEGRATIONS_SPOTIFY_CLIENT_SECRET_FILE: /run/secrets/tf_integrations_spotify_client_secret
      TF_INTEGRATIONS_TOKEN_KEYRING_FILE: /run/secrets/tf_integrations_token_keyring
    secrets:
      - source: tf_integrations_runtime_database_url
        target: tf_integrations_runtime_database_url
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: tf_integrations_token_keyring
        target: tf_integrations_token_keyring
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: tf_integrations_spotify_client_id
        target: tf_integrations_spotify_client_id
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: tf_integrations_spotify_client_secret
        target: tf_integrations_spotify_client_secret
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: tf_integrations_internal_auth_secret
        target: tf_integrations_internal_auth_secret
        uid: "10001"
        gid: "10001"
        mode: "0400"
      - source: tf_integrations_heartbeat_secret
        target: tf_integrations_heartbeat_secret
        uid: "10001"
        gid: "10001"
        mode: "0400"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      tf-integrations-control:
        gw_priority: 0
      tf-integrations-data:
        gw_priority: 0
      tf-integrations-egress:
        gw_priority: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    stop_grace_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.25"
          memory: 128M
    depends_on:
      tf-integrations-migrate:
        condition: service_completed_successfully
      tf-integrations-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  tf-search:
    build:
      context: .
      dockerfile: artifacts/tf-search/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    init: true
    environment:
      APOLLO_API_VERSION: "${TF_SEARCH_VERSION:-unknown}"
      APOLLO_DEPLOYED_AT: "${TF_SEARCH_DEPLOYED_AT:-}"
      NODE_ENV: production
      PORT: "8080"
      TF_SEARCH_HEARTBEAT_ALLOW_INSECURE_HTTP: "true"
      TF_SEARCH_HEARTBEAT_API_ORIGIN: http://api:8080
      TF_SEARCH_HEARTBEAT_SECRET_FILE: /run/secrets/tf_search_heartbeat_secret
      TF_SEARCH_INTERNAL_AUTH_SECRET_FILE: /run/secrets/tf_search_internal_auth_secret
    secrets:
      - tf_search_internal_auth_secret
      - tf_search_heartbeat_secret
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /tmp/yt-dlp:rw,noexec,nosuid,size=64m
    networks:
      tf-search-control:
        gw_priority: 0
      tf-search-egress:
        gw_priority: 1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    stop_grace_period: 20s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 128
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: artifacts/music-player/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-https://api.tf.apollot.ru}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TF_WEB_PORT:-3000}:80"
    networks:
      - tf-edge

  admin:
    build:
      context: .
      dockerfile: artifacts/admin-dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TF_ADMIN_PORT:-3001}:80"
    environment:
      APOLLO_API_UPSTREAM: "http://api:8080"
      ADMIN_DASHBOARD_TOKEN: "${ADMIN_DASHBOARD_TOKEN:-}"
      ADMIN_ACCESS_USER: "${ADMIN_ACCESS_USER:-}"
      ADMIN_ACCESS_PASSWORD: "${ADMIN_ACCESS_PASSWORD:-}"
    networks:
      - tf-edge
    depends_on:
      api:
        condition: service_healthy

secrets:
  tf_client_secret:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_client_secret
  tf_database_url:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_database_url
  tf_integrations_postgres_admin_password:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_postgres_admin_password
  tf_integrations_migrator_password:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_migrator_password
  tf_integrations_runtime_password:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_runtime_password
  tf_integrations_migrator_database_url:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_migrator_database_url
  tf_integrations_runtime_database_url:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_runtime_database_url
  tf_integrations_token_keyring:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_token_keyring
  tf_integrations_spotify_client_id:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_spotify_client_id
  tf_integrations_spotify_client_secret:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_spotify_client_secret
  tf_integrations_internal_auth_secret:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_internal_auth_secret
  tf_integrations_heartbeat_secret:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_integrations_heartbeat_secret
  tf_download_queue_password:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_download_queue_password
  tf_download_queue_redis_url:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_download_queue_redis_url
  tf_download_internal_auth_secret:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_download_internal_auth_secret
  tf_download_heartbeat_secret:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_download_heartbeat_secret
  tf_module_heartbeat_keys:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_module_heartbeat_keys
  tf_postgres_password:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_postgres_password
  tf_search_heartbeat_secret:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_search_heartbeat_secret
  tf_search_internal_auth_secret:
    file: ${TF_SECRET_DIRECTORY:-/var/lib/apollo-tf/secrets}/tf_search_internal_auth_secret

volumes:
  pgdata:
  redis_data:
  tf-integrations-postgres-data:
  tf-download-redis-data:
  tf-download-worker-data:

networks:
  tf-data:
    internal: true
  tf-edge:
  tf-integrations-control:
    internal: true
  tf-integrations-data:
    internal: true
  tf-integrations-egress: {}
  tf-search-control:
    internal: true
  tf-search-egress: {}
  tf-download-queue:
    internal: true
  tf-download-control:
    internal: true
  tf-download-egress: {}
