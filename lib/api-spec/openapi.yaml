openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Music Player API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tracks
    description: Track search, streaming, and download operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tracks/search:
    post:
      operationId: searchTracks
      tags: [tracks]
      summary: Search for track variants
      description: Searches enabled open media sources for variants of a track. Returns all found variants (original, remix, live, cover) without auto-selecting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: List of track variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Search module unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracks/{id}/stream:
    get:
      operationId: getTrackStream
      tags: [tracks]
      summary: Get stream URL for a track
      description: Returns a direct audio stream URL for playback. URL may expire.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Track ID from search results. Format: yt_<base64url> or sc_<base64url>."
      responses:
        "200":
          description: Stream URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracks/{id}/download:
    get:
      operationId: getTrackDownload
      tags: [tracks]
      summary: Get download URL for a track
      description: Returns a direct download URL for the best quality audio. URL may expire.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Track ID from search results. Format: yt_<base64url> or sc_<base64url>."
      responses:
        "200":
          description: Download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResponse"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracks/download/queue:
    post:
      operationId: queueTrackDownloads
      tags: [tracks]
      summary: Queue tracks for download
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadQueueRequest"
      responses:
        "200":
          description: Per-track queue outcomes when at least one track is accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadQueueResponse"
        "400":
          description: Invalid queue request or unresolvable trusted source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
        "403":
          description: Missing download or Deezer fallback entitlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
        "503":
          description: Download queue unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
  /tracks/download/jobs:
    get:
      operationId: listDownloadJobs
      tags: [tracks]
      summary: List current account download jobs
      responses:
        "200":
          description: Current account download jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobListResponse"
        "503":
          description: Download queue unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
  /tracks/download/status/{jobId}:
    get:
      operationId: getDownloadJobStatus
      tags: [tracks]
      summary: Get a download job status
      parameters:
        - $ref: "#/components/parameters/DownloadJobId"
      responses:
        "200":
          description: Current download job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"
        "404":
          description: Download job is unknown or belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
        "503":
          description: Download queue unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
  /tracks/download/file/{jobId}:
    get:
      operationId: getDownloadJobFile
      tags: [tracks]
      summary: Stream a completed download file
      parameters:
        - $ref: "#/components/parameters/DownloadJobId"
        - name: Range
          in: header
          required: false
          description: Optional single byte range.
          schema:
            type: string
            pattern: ^bytes=(0|[1-9][0-9]*)-((0|[1-9][0-9]*))?$
      responses:
        "200":
          description: Completed audio file
          headers:
            Accept-Ranges:
              required: true
              schema:
                type: string
                const: bytes
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 1073741824
            Content-Disposition:
              required: true
              schema:
                type: string
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
        "206":
          description: Requested audio byte range
          headers:
            Accept-Ranges:
              required: true
              schema:
                type: string
                const: bytes
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 1073741824
            Content-Disposition:
              required: true
              schema:
                type: string
            Content-Range:
              required: true
              schema:
                type: string
                pattern: ^bytes (0|[1-9][0-9]*)-(0|[1-9][0-9]*)/[1-9][0-9]*$
            Cache-Control:
              required: true
              schema:
                type: string
                const: private, no-store
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/flac:
              schema:
                type: string
                format: binary
        "404":
          description: Download file is unknown or belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
        "409":
          description: Download file is not completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
        "416":
          description: Range is invalid or not satisfiable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
        "503":
          description: Download worker unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
  /tracks/download/jobs/{jobId}:
    delete:
      operationId: cancelDownloadJob
      tags: [tracks]
      summary: Cancel a queued or active download job
      parameters:
        - $ref: "#/components/parameters/DownloadJobId"
      responses:
        "200":
          description: Download job cancellation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobCancelResponse"
        "404":
          description: Download job is unknown or belongs to another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
        "503":
          description: Download queue unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadErrorResponse"
components:
  parameters:
    DownloadJobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TrackType:
      type: string
      enum:
        - original
        - remix
        - live
        - cover

    TrackSource:
      type: string
      enum:
        - youtube
        - soundcloud
        - bandcamp
        - deezer

    TrackResult:
      type: object
      properties:
        id:
          type: string
          description: "Unique track ID. Format: yt_<base64url(https://www.youtube.com/watch?v=ID)> for YouTube or sc_<base64url(permalink_url)> for SoundCloud. Pass this ID to /stream or /download endpoints."
        title:
          type: string
        artist:
          type: string
        type:
          $ref: "#/components/schemas/TrackType"
        duration:
          type: integer
          description: Duration in seconds
        source:
          $ref: "#/components/schemas/TrackSource"
        thumbnailUrl:
          type: string
          nullable: true
        quality:
          type: array
          items:
            type: string
          description: Available quality options (e.g. ["128", "320"])
        viewCount:
          type: integer
          nullable: true
        score:
          type: number
          description: Ranking score (higher is better match)
      required:
        - id
        - title
        - artist
        - type
        - duration
        - source
        - quality
        - score

    SearchRequest:
      type: object
      properties:
        artist:
          type: string
          minLength: 1
          maxLength: 200
          description: Artist name, trimmed before validation
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Track title, trimmed before validation
        mode:
          type: string
          enum:
            - auto
            - manual
        sources:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - yt
              - sc
              - bc
              - dz
        maxResults:
          type: integer
          minimum: 1
          maximum: 40
      required:
        - artist
        - title

    SearchResponse:
      type: object
      properties:
        query:
          type: string
          description: The normalized search query used
        results:
          type: array
          items:
            $ref: "#/components/schemas/TrackResult"
        cached:
          type: boolean
          description: Whether results came from cache
        sources:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - yt
              - sc
              - bc
              - dz
        fallbackAvailable:
          type: boolean
          description: Whether broadening a manual source selection may return results
      required:
        - query
        - results
        - cached
        - sources
        - fallbackAvailable

    StreamResponse:
      type: object
      properties:
        id:
          type: string
        streamUrl:
          type: string
        mimeType:
          type: string
          nullable: true
      required:
        - id
        - streamUrl

    DownloadResponse:
      type: object
      properties:
        id:
          type: string
        downloadUrl:
          type: string
        filename:
          type: string
          nullable: true
      required:
        - id
        - downloadUrl

    DownloadQuality:
      type: string
      enum: ["128", "192", "256", "320", flac]

    DownloadQueueTrack:
      type: object
      additionalProperties: false
      properties:
        trackId:
          type: string
          minLength: 1
          maxLength: 4096
        artist:
          type: string
          minLength: 1
          maxLength: 300
        title:
          type: string
          minLength: 1
          maxLength: 500
        quality:
          $ref: "#/components/schemas/DownloadQuality"
      required: [trackId, artist, title, quality]

    DownloadQueueRequest:
      type: object
      additionalProperties: false
      properties:
        tracks:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/DownloadQueueTrack"
      required: [tracks]

    DownloadQueueSuccessResult:
      type: object
      additionalProperties: false
      properties:
        trackId:
          type: string
          minLength: 1
          maxLength: 4096
        jobId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
          maximum: 200
      required: [trackId, jobId, position]

    DownloadQueueFailureResult:
      type: object
      additionalProperties: false
      properties:
        trackId:
          type: string
          minLength: 1
          maxLength: 4096
        error:
          type: string
          const: download_queue_unavailable
      required: [trackId, error]

    DownloadQueueResult:
      oneOf:
        - $ref: "#/components/schemas/DownloadQueueSuccessResult"
        - $ref: "#/components/schemas/DownloadQueueFailureResult"

    DownloadQueueResponse:
      type: object
      additionalProperties: false
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/DownloadQueueResult"
      required: [results]

    DownloadJobState:
      type: string
      enum: [waiting, active, completed, failed, canceled]

    DownloadJobStatus:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/DownloadJobState"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        position:
          type: integer
          minimum: 1
          maximum: 200
        fileSize:
          type: integer
          minimum: 1
          maximum: 1073741824
      required: [status, progress]

    DownloadJob:
      type: object
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DownloadJobState"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        position:
          type: integer
          minimum: 1
          maximum: 200
        fileSize:
          type: integer
          minimum: 1
          maximum: 1073741824
      required: [jobId, status, progress]

    DownloadJobListResponse:
      type: object
      additionalProperties: false
      properties:
        jobs:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/DownloadJob"
      required: [jobs]

    DownloadJobCancelResponse:
      type: object
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DownloadJobState"
      required: [jobId, status]

    DownloadErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          enum:
            - bad_request
            - module_access_denied
            - download_queue_unavailable
            - job_not_found
            - file_not_found
            - file_not_ready
            - range_not_satisfiable
            - worker_unavailable
      required: [error]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    SearchUnavailableResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          const: search_unavailable
      required:
        - error
