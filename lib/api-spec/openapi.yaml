openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Music Player API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tracks
    description: Track search, streaming, and download operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tracks/search:
    post:
      operationId: searchTracks
      tags: [tracks]
      summary: Search for track variants
      description: Searches enabled open media sources for variants of a track. Returns all found variants (original, remix, live, cover) without auto-selecting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: List of track variants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Search module unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchUnavailableResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracks/{id}/stream:
    get:
      operationId: getTrackStream
      tags: [tracks]
      summary: Get stream URL for a track
      description: Returns a direct audio stream URL for playback. URL may expire.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Track ID from search results. Format: yt_<base64url> or sc_<base64url>."
      responses:
        "200":
          description: Stream URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamResponse"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /tracks/{id}/download:
    get:
      operationId: getTrackDownload
      tags: [tracks]
      summary: Get download URL for a track
      description: Returns a direct download URL for the best quality audio. URL may expire.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: "Track ID from search results. Format: yt_<base64url> or sc_<base64url>."
      responses:
        "200":
          description: Download URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadResponse"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TrackType:
      type: string
      enum:
        - original
        - remix
        - live
        - cover

    TrackSource:
      type: string
      enum:
        - youtube
        - soundcloud
        - bandcamp
        - deezer

    TrackResult:
      type: object
      properties:
        id:
          type: string
          description: "Unique track ID. Format: yt_<base64url(https://www.youtube.com/watch?v=ID)> for YouTube or sc_<base64url(permalink_url)> for SoundCloud. Pass this ID to /stream or /download endpoints."
        title:
          type: string
        artist:
          type: string
        type:
          $ref: "#/components/schemas/TrackType"
        duration:
          type: integer
          description: Duration in seconds
        source:
          $ref: "#/components/schemas/TrackSource"
        thumbnailUrl:
          type: string
          nullable: true
        quality:
          type: array
          items:
            type: string
          description: Available quality options (e.g. ["128", "320"])
        viewCount:
          type: integer
          nullable: true
        score:
          type: number
          description: Ranking score (higher is better match)
      required:
        - id
        - title
        - artist
        - type
        - duration
        - source
        - quality
        - score

    SearchRequest:
      type: object
      properties:
        artist:
          type: string
          minLength: 1
          maxLength: 200
          description: Artist name, trimmed before validation
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: Track title, trimmed before validation
        mode:
          type: string
          enum:
            - auto
            - manual
        sources:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - yt
              - sc
              - bc
              - dz
        maxResults:
          type: integer
          minimum: 1
          maximum: 40
      required:
        - artist
        - title

    SearchResponse:
      type: object
      properties:
        query:
          type: string
          description: The normalized search query used
        results:
          type: array
          items:
            $ref: "#/components/schemas/TrackResult"
        cached:
          type: boolean
          description: Whether results came from cache
        sources:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - yt
              - sc
              - bc
              - dz
        fallbackAvailable:
          type: boolean
          description: Whether broadening a manual source selection may return results
      required:
        - query
        - results
        - cached
        - sources
        - fallbackAvailable

    StreamResponse:
      type: object
      properties:
        id:
          type: string
        streamUrl:
          type: string
        mimeType:
          type: string
          nullable: true
      required:
        - id
        - streamUrl

    DownloadResponse:
      type: object
      properties:
        id:
          type: string
        downloadUrl:
          type: string
        filename:
          type: string
          nullable: true
      required:
        - id
        - downloadUrl

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    SearchUnavailableResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
          const: search_unavailable
      required:
        - error
