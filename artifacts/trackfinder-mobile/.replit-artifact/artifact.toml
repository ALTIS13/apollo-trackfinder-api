kind = "mobile"
previewPath = "/mobile/"
title = "TrackFinder Mobile"
version = "1.0.0"
id = "artifacts/trackfinder-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22578

[services.development]
run = "pnpm --filter @workspace/trackfinder-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/trackfinder-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/trackfinder-mobile", "run", "serve" ]

[services.env]
PORT = "22578"
BASE_PATH = "/mobile/"
