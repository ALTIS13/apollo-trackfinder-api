limit_req_zone $binary_remote_addr zone=apollo_admin:10m rate=30r/m;
log_format apollo_admin_safe '$remote_addr - - [$time_local] "$request" '
                             '$status $body_bytes_sent "$http_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  listen [::]:80;
  server_name _;
  access_log /var/log/nginx/access.log apollo_admin_safe;

  root /usr/share/nginx/html;
  index index.html;
  auth_basic "Apollo TF Admin";
  auth_basic_user_file /etc/nginx/.htpasswd;

  location = /healthz {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api/admin/dashboard {
    limit_req zone=apollo_admin burst=5 nodelay;

    if ($request_method != GET) {
      return 405;
    }

    resolver 127.0.0.11 ipv6=off valid=30s;
    set $apollo_api_upstream "${APOLLO_API_UPSTREAM}";
    proxy_http_version 1.1;
    proxy_set_header X-Admin-Dashboard-Token "${ADMIN_DASHBOARD_TOKEN}";
    proxy_pass $apollo_api_upstream$request_uri;
  }

  location ^~ /api/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
