server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header X-Admin-Dashboard-Token "${ADMIN_DASHBOARD_TOKEN}";
    proxy_pass ${APOLLO_API_UPSTREAM};
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
