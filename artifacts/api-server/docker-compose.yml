services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: apollo_trackfinder
      POSTGRES_PASSWORD_FILE: /run/secrets/tf_postgres_password
      POSTGRES_USER: apollo
    secrets:
      - tf_postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tf-data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U apollo -d apollo_trackfinder"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-bookworm
    user: "999:999"
    restart: unless-stopped
    read_only: true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - tf-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    ports:
      - "127.0.0.1:${TF_API_PORT:-8080}:8080"
    environment:
      ADMIN_DASHBOARD_TOKEN: "${ADMIN_DASHBOARD_TOKEN:-}"
      APOLLO_API_VERSION: "${APOLLO_API_VERSION:-unknown}"
      APOLLO_DEPLOYED_AT: "${APOLLO_DEPLOYED_AT:-}"
      APOLLO_MODULE_HEARTBEAT_KEYS: "${APOLLO_MODULE_HEARTBEAT_KEYS:-}"
      APOLLO_PLATFORM_API_ORIGIN: "${APOLLO_PLATFORM_API_ORIGIN:-https://api.apollot.ru}"
      APOLLO_PLATFORM_ISSUER: "${APOLLO_PLATFORM_ISSUER:-https://api.apollot.ru}"
      APOLLO_TF_AUTH_REDIS_URL: redis://redis:6379/1
      APOLLO_TF_CALLBACK_URL: "${APOLLO_TF_CALLBACK_URL:-https://api.tf.apollot.ru/api/auth/callback}"
      APOLLO_TF_CLIENT_ID: "${APOLLO_TF_CLIENT_ID:-apollo-tf-api}"
      APOLLO_TF_CLIENT_SECRET_FILE: /run/secrets/tf_client_secret
      APOLLO_TF_WEB_ORIGIN: "${APOLLO_TF_WEB_ORIGIN:-https://tf.apollot.ru}"
      DATABASE_URL_FILE: /run/secrets/tf_database_url
      NODE_ENV: production
      PORT: "8080"
      REDIS_URL: redis://redis:6379/0
      SERVER_URL: "${SERVER_URL:-https://api.tf.apollot.ru}"
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET:-}"
      WEB_URL: "${WEB_URL:-https://tf.apollot.ru}"
    secrets:
      - tf_client_secret
      - tf_database_url
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /tmp/tf-downloads:rw,noexec,nosuid,size=256m
    networks:
      - tf-data
      - tf-edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/api/readyz').then(r=>{if(!r.ok)process.exit(1)})
      interval: 5s
      timeout: 3s
      retries: 20

secrets:
  tf_client_secret:
    file: ${TF_SECRET_DIRECTORY:?}/tf_client_secret
  tf_database_url:
    file: ${TF_SECRET_DIRECTORY:?}/tf_database_url
  tf_postgres_password:
    file: ${TF_SECRET_DIRECTORY:?}/tf_postgres_password

volumes:
  postgres_data:
  redis_data:

networks:
  tf-data:
    internal: true
  tf-edge:
