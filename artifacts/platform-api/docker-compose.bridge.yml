name: ${COMPOSE_PROJECT_NAME:-apollo-platform-tf-bridge}

services:
  platform-postgres:
    build:
      context: .
      dockerfile: artifacts/platform-api/Dockerfile
      target: postgres-role-init
    image: apollo-platform-postgres:bridge
    restart: unless-stopped
    environment:
      POSTGRES_DB: apollo_platform
      POSTGRES_PASSWORD_FILE: /run/secrets/platform_postgres_admin_password
      POSTGRES_USER: postgres
    secrets:
      - platform_postgres_admin_password
      - platform_migrator_password
      - platform_runtime_password
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
    networks:
      - platform-data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d apollo_platform"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  platform-redis:
    image: redis:7-bookworm
    user: "999:999"
    restart: unless-stopped
    read_only: true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - platform-redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - platform-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  platform-migrate:
    build:
      context: .
      dockerfile: artifacts/platform-api/Dockerfile
      target: runtime
    image: apollo-platform-api:bridge
    user: "10001:10001"
    read_only: true
    command: ["node", "/app/dist/migrate.mjs"]
    environment:
      MIGRATOR_DATABASE_URL_FILE: /run/secrets/platform_migrator_database_url
    secrets:
      - platform_migrator_database_url
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - platform-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      platform-postgres:
        condition: service_healthy
    restart: "no"

  platform-api:
    build:
      context: .
      dockerfile: artifacts/platform-api/Dockerfile
      target: runtime
    image: apollo-platform-api:bridge
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT:?}:8080"
    environment:
      APOLLO_ALLOWED_ORIGINS: ${PLATFORM_ALLOWED_ORIGINS:?}
      APOLLO_ASSERTION_PRIVATE_JWK_FILE: /run/secrets/platform_assertion_private_jwk
      APOLLO_ASSERTION_PUBLIC_JWKS_FILE: /run/secrets/platform_assertion_public_jwks
      APOLLO_DEVELOPMENT_TOKEN_ECHO: "true"
      APOLLO_INTROSPECTION_CLIENT_ID: apollo-tf-api
      APOLLO_ISSUER: ${PLATFORM_PUBLIC_ORIGIN:?}
      APOLLO_OAUTH_CLIENTS_FILE: /run/secrets/platform_oauth_clients
      APOLLO_OPERATOR_BOOTSTRAP_TOKEN_FILE: /run/secrets/platform_operator_bootstrap_token
      APOLLO_REDIS_URL: redis://platform-redis:6379
      APOLLO_TRUST_PROXY_HOPS: "0"
      DATABASE_URL_FILE: /run/secrets/platform_runtime_database_url
      NODE_ENV: development
      PORT: "8080"
    secrets:
      - platform_assertion_private_jwk
      - platform_assertion_public_jwks
      - platform_oauth_clients
      - platform_operator_bootstrap_token
      - platform_runtime_database_url
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - bridge-edge
      - platform-data
      - platform-tf-control
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      platform-migrate:
        condition: service_completed_successfully
      platform-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all(['/healthz','/readyz'].map(async p=>{const r=await fetch('http://127.0.0.1:8080'+p);if(!r.ok)throw new Error('not ready')}))
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  tf-postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: apollo_tf
      POSTGRES_PASSWORD_FILE: /run/secrets/tf_postgres_password
      POSTGRES_USER: apollo_tf_runtime
    secrets:
      - tf_postgres_password
    volumes:
      - tf-postgres-data:/var/lib/postgresql/data
    networks:
      - tf-data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U apollo_tf_runtime -d apollo_tf",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  tf-redis:
    image: redis:7-bookworm
    user: "999:999"
    restart: unless-stopped
    read_only: true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tf-redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - tf-data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  tf-api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    image: apollo-tf-api:bridge
    user: "10001:10001"
    read_only: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TF_API_PORT:?}:8080"
    environment:
      APOLLO_PLATFORM_API_ORIGIN: http://platform-api:8080
      APOLLO_PLATFORM_ISSUER: ${PLATFORM_PUBLIC_ORIGIN:?}
      APOLLO_TF_AUTH_REDIS_URL: redis://tf-redis:6379/1
      APOLLO_TF_BRIDGE_ALLOW_INTERNAL_HTTP: "true"
      APOLLO_TF_BRIDGE_PKCE_VERIFIER_FILE: /run/secrets/tf_pkce_verifier
      APOLLO_TF_CALLBACK_URL: ${TF_PUBLIC_ORIGIN:?}/api/auth/callback
      APOLLO_TF_CLIENT_ID: apollo-tf-api
      APOLLO_TF_CLIENT_SECRET_FILE: /run/secrets/tf_client_secret
      APOLLO_TF_WEB_ORIGIN: ${TF_PUBLIC_ORIGIN:?}
      DATABASE_URL_FILE: /run/secrets/tf_database_url
      NODE_ENV: development
      PORT: "8080"
      REDIS_URL: redis://tf-redis:6379/0
      SERVER_URL: ${TF_PUBLIC_ORIGIN:?}
      WEB_URL: ${TF_PUBLIC_ORIGIN:?}
    secrets:
      - tf_client_secret
      - tf_database_url
      - tf_pkce_verifier
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /tmp/tf-downloads:rw,noexec,nosuid,size=64m
    networks:
      - bridge-edge
      - tf-data
      - platform-tf-control
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      platform-api:
        condition: service_healthy
      tf-postgres:
        condition: service_healthy
      tf-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          Promise.all(['/api/healthz','/api/readyz'].map(async p=>{const r=await fetch('http://127.0.0.1:8080'+p);if(!r.ok)throw new Error('not ready')}))
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 8s

secrets:
  platform_assertion_private_jwk:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/platform_assertion_private_jwk
  platform_assertion_public_jwks:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/platform_assertion_public_jwks
  platform_migrator_database_url:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/platform_migrator_database_url
  platform_migrator_password:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/platform_migrator_password
  platform_oauth_clients:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/platform_oauth_clients
  platform_operator_bootstrap_token:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/platform_operator_bootstrap_token
  platform_postgres_admin_password:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/platform_postgres_admin_password
  platform_runtime_database_url:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/platform_runtime_database_url
  platform_runtime_password:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/platform_runtime_password
  tf_client_secret:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/tf_client_secret
  tf_database_url:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/tf_database_url
  tf_pkce_verifier:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/tf_pkce_verifier
  tf_postgres_password:
    file: ${BRIDGE_SECRET_DIRECTORY:?}/tf_postgres_password

volumes:
  platform-postgres-data:
  platform-redis-data:
  tf-postgres-data:
  tf-redis-data:

networks:
  bridge-edge:
  platform-data:
    internal: true
  tf-data:
    internal: true
  platform-tf-control:
    internal: true
